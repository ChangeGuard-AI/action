# ChangeGuard — judge a change before it ships.
#
# This is the CANONICAL judgment logic, versioned here under ChangeGuard's
# control. Customer repositories call it; they do not copy it. That means a
# customer's integration improves when this file improves, without anyone
# touching their repository — and it means ChangeGuard never needs write access
# to a customer's CI configuration.
#
# A caller repository contains only this:
#
#   name: ChangeGuard
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     changeguard:
#       uses: ChangeGuard-AI/action/.github/workflows/judge.yml@v1
#
# HOW IT AUTHENTICATES. Two ways, tried in this order:
#
#   1. GitHub Actions OIDC (default, and what the setup flow generates).
#      GitHub mints a short-lived token stating which repository this job is
#      running in, signed by GitHub. ChangeGuard verifies it and looks the
#      repository up in the connection the customer made. Nothing to create,
#      nothing to paste into GitHub, nothing to rotate, nothing to leak. This
#      is why the caller needs `id-token: write` — without it GitHub will not
#      mint the token, and there is nothing this workflow can do about that.
#
#   2. CHANGEGUARD_API_KEY (unchanged, for repositories set up before OIDC and
#      for anyone who prefers it). Pass it with `secrets: inherit`.
#
# If both are available the API key wins, because a customer who set one is
# telling us which identity to use.
#
# IDENTITY. ChangeGuard mints change_id server-side and returns it. This
# workflow captures it and exposes it as a job output so the caller can hand it
# to outcome.yml after deploying. It never invents an id and never allows an
# outcome to be attributed by recency — temporal proximity is not identity.
#
# WHAT IT SENDS. The Kubernetes manifests this change touches, so Preflight
# judges the PROPOSED OBJECT and not merely the environment it would land in.
# Every deterministic rule Preflight has — will these replicas fit the
# namespace quota, is this image pinned to a digest, does this ServiceAccount
# already hold cluster-admin, does this Service have anything to select — takes
# the proposed object as its input. Without one they have nothing to evaluate
# and silently do not run, which produces a verdict that looks like a judgment
# of the change and is a judgment of the cluster.
#
# Manifests are discovered by asking GitHub which files this change touched and
# reading those files back. No repository checkout, no third-party action, and
# no permission beyond the `contents: read` the caller already grants. Files
# are included only if they look like Kubernetes objects; anything left out is
# named in the job summary rather than passed over in silence.

name: ChangeGuard judge

on:
  workflow_call:
    inputs:
      backend_url:
        description: 'ChangeGuard backend. Leave unset unless you were told otherwise.'
        required: false
        type: string
        default: ''
      environment:
        description: 'Overrides the environment ChangeGuard configured for this repository.'
        required: false
        type: string
        default: ''
      enforce_block:
        description: 'Fail the build on BLOCK. Set false to run advisory while you build confidence — the verdict is still recorded either way.'
        required: false
        type: boolean
        default: true
      enforce_hold:
        description: 'Also fail on HOLD. Off by default: HOLD means "look at this", not "stop".'
        required: false
        type: boolean
        default: false
    secrets:
      CHANGEGUARD_API_KEY:
        description: 'Only for repositories connected before OIDC. Leave unset to use the GitHub identity token.'
        required: false
    outputs:
      change_id:
        description: 'ChangeGuard change identity — pass to outcome.yml.'
        value: ${{ jobs.judge.outputs.change_id }}
      verdict_id:
        description: 'ChangeGuard verdict identity — pass to outcome.yml.'
        value: ${{ jobs.judge.outputs.verdict_id }}
      verdict:
        description: 'SHIP | HOLD | BLOCK | UNAVAILABLE'
        value: ${{ jobs.judge.outputs.verdict }}
      csc:
        description: 'Confidence score 0-100.'
        value: ${{ jobs.judge.outputs.csc }}

jobs:
  judge:
    name: Judge the change
    runs-on: ubuntu-latest
    # DELIBERATELY NO `permissions:` BLOCK.
    #
    # A reusable workflow's permissions can only narrow the caller's, never
    # widen them. Declaring `id-token: write` here would therefore not enable
    # anything — it would hard-fail, at workflow-parse time, for every existing
    # caller whose repository has not granted id-token, before a single step
    # ran. Those callers authenticate with an API key and must keep working
    # untouched.
    #
    # Omitting the block means this job inherits whatever the caller granted:
    # a new caller grants id-token: write and gets OIDC, an older one grants
    # nothing extra and uses its key. The step below detects which it got.
    outputs:
      change_id: ${{ steps.preflight.outputs.change_id }}
      verdict_id: ${{ steps.preflight.outputs.verdict_id }}
      verdict: ${{ steps.preflight.outputs.verdict }}
      csc: ${{ steps.preflight.outputs.csc }}
    steps:
      - name: Find what this change proposes
        id: proposed
        env:
          # Untrusted inputs (a branch name, a PR title) reach this script
          # ONLY through the environment. Interpolating them into the script
          # body would let a pull request title run commands in a job holding
          # the caller's token — a public, well-worn way to lose a repository.
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          API="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          VER='X-GitHub-Api-Version: 2022-11-28'
          : > /tmp/cg-manifest.yaml
          : > /tmp/cg-ids.txt
          COUNT=0
          BYTES=0
          FILES=""
          SKIPPED=""
          UNREADABLE=""
          DUPES=""
          NOTE=""

          # ── What a changed file actually IS ─────────────────────────────
          #
          # Every question the step has to answer — is this a Kubernetes
          # object, will it parse, is it a build instruction, which object
          # does it define — is one YAML load. Doing it by grepping for
          # `kind:` answers none of them properly: a cache setting whose
          # value is `kind: redis` is not a manifest, a kustomization.yaml is
          # not an object, and a file with a broken indent is a manifest the
          # customer needs told about rather than one to pass over.
          cat > /tmp/cg-classify.py <<'CG_CLASSIFY_EOF'
          import sys
          try:
              import yaml
          except Exception:
              print("nopy|"); sys.exit(0)
          try:
              raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          except Exception as e:
              print("invalid|could not read the file: %s" % e); sys.exit(0)
          try:
              # Every document, not just the first: a file whose second document is
              # broken is still a file ChangeGuard cannot read.
              docs = list(yaml.safe_load_all(raw))
          except yaml.YAMLError as e:
              msg = str(getattr(e, "problem", None) or e).strip().replace("\n", " ")
              mark = getattr(e, "problem_mark", None)
              if mark is not None:
                  msg = "line %d: %s" % (mark.line + 1, msg)
              print("invalid|%s" % msg[:200]); sys.exit(0)
          except Exception as e:
              print("invalid|%s" % str(e)[:200].replace("\n", " ")); sys.exit(0)
          ids = []
          kustomize = ""
          for d in docs:
              if not isinstance(d, dict):
                  continue
              kind, api = d.get("kind"), d.get("apiVersion")
              # Two checks, deliberately separate. Either one alone excludes
              # most non-manifests, so a combined test lets one half rot
              # unnoticed — and each is doing real work: a config file whose
              # top-level key is `kind` has no apiVersion, and a Helm
              # Chart.yaml has an apiVersion and no kind.
              if not isinstance(api, str) or not api.strip():
                  continue
              if not isinstance(kind, str) or not kind.strip():
                  continue
              # Kustomize describes how to BUILD manifests. Judging the instruction
              # rather than the object it produces reports on the wrong thing while
              # looking like it judged the change.
              if kind in ("Kustomization", "Component") and "kustomize" in api:
                  kustomize = kind
                  continue
              meta = d.get("metadata")
              meta = meta if isinstance(meta, dict) else {}
              name, ns = meta.get("name"), meta.get("namespace")
              ids.append("%s/%s/%s" % (
                  kind.strip(),
                  ns if isinstance(ns, str) and ns.strip() else "default",
                  name if isinstance(name, str) and name.strip() else "?"))
          if ids:
              print("object|%s" % ";".join(ids))
          elif kustomize:
              print("kustomize|%s" % kustomize)
          else:
              print("notk8s|")
          CG_CLASSIFY_EOF

          # The range. For a pull request HEAD is the merge commit GitHub
          # created, which is what would actually land, so the files read
          # below are the merged result rather than the branch in isolation.
          BASE=""
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${PUSH_BEFORE}"
          fi

          if [ -z "${BASE}" ]; then
            # A branch's first push has no previous state. Diffing against
            # everything would submit the whole repository as though a
            # customer had proposed all of it at once.
            NOTE="This is the first push to this branch, so there is no previous state to compare against. ChangeGuard judged the environment rather than a proposed object."
          else
            CMP=$(curl -sS --max-time 30 -o /tmp/cg-compare.json -w '%{http_code}' \
                    -H "${AUTH}" -H 'Accept: application/vnd.github+json' -H "${VER}" \
                    "${API}/compare/${BASE}...${GITHUB_SHA}") || CMP="000"
            if [ "${CMP}" != "200" ]; then
              NOTE="ChangeGuard could not read which files this change touches (GitHub returned HTTP ${CMP}), so it judged the environment rather than a proposed object."
            else
              # A deleted file proposes no object. A rename is read at its new
              # path, which is the object that will exist.
              jq -r '[.files // [] | .[]
                      | select(.status != "removed")
                      | .filename
                      | select(test("\\.ya?ml$"))] | .[]' \
                 /tmp/cg-compare.json > /tmp/cg-candidates.txt || : > /tmp/cg-candidates.txt

              while IFS= read -r F; do
                [ -n "${F}" ] || continue
                if [ "${COUNT}" -ge 20 ]; then
                  SKIPPED="${SKIPPED}${SKIPPED:+, }${F}"
                  continue
                fi
                RAW=$(curl -sS --max-time 30 -o /tmp/cg-file.yaml -w '%{http_code}' \
                        -H "${AUTH}" -H 'Accept: application/vnd.github.raw' -H "${VER}" \
                        "${API}/contents/${F}?ref=${GITHUB_SHA}") || RAW="000"
                [ "${RAW}" = "200" ] || continue

                # Templates first, and textually, because a Helm template
                # usually is not valid YAML — classifying it would report a
                # syntax error in a file whose syntax is fine until it is
                # rendered.
                if grep -qF '{{' /tmp/cg-file.yaml; then
                  SKIPPED="${SKIPPED}${SKIPPED:+, }${F} (a template — ChangeGuard judges rendered manifests, so point it at the output of helm template or kustomize build)"
                  continue
                fi

                # The exit status is kept separate from the answer. A
                # classifier that CRASHED and one that found no YAML parser
                # are different facts, and reporting the second when the first
                # happened would be a small lie in the place this step exists
                # to stop telling them.
                if CLASS=$(python3 /tmp/cg-classify.py /tmp/cg-file.yaml 2>/dev/null); then
                  :
                else
                  CLASS="crashed|"
                fi
                KIND="${CLASS%%|*}"
                DETAIL="${CLASS#*|}"

                if [ "${KIND}" = "nopy" ] || [ "${KIND}" = "crashed" ]; then
                  # Fall back to a textual sniff rather than dropping the
                  # change on the floor — but say which shallower check the
                  # customer actually got, and why.
                  if [ "${KIND}" = "nopy" ]; then
                    WHY="This runner has no YAML parser, so manifests were identified by inspection rather than parsed."
                  else
                    WHY="ChangeGuard could not classify one or more files and fell back to identifying manifests by inspection. The verdict below still stands on what was submitted."
                  fi
                  case "${NOTE}" in
                    *"${WHY}"*) : ;;
                    *) NOTE="${NOTE}${NOTE:+ }${WHY}" ;;
                  esac
                  grep -qE '^[[:space:]]*apiVersion:' /tmp/cg-file.yaml || continue
                  grep -qE '^[[:space:]]*kind:' /tmp/cg-file.yaml || continue
                  KIND="object"
                  DETAIL=""
                fi

                case "${KIND}" in
                  notk8s)
                    # Not a candidate and never was. Listing every YAML file
                    # in the repository as "not judged" would bury the cases
                    # that matter.
                    continue ;;
                  kustomize)
                    SKIPPED="${SKIPPED}${SKIPPED:+, }${F} (${DETAIL} builds manifests rather than being one — ChangeGuard judges the manifests it produces)"
                    continue ;;
                  invalid)
                    # Submitted anyway. ChangeGuard records that it could not
                    # read the file, which belongs on the Change record; the
                    # summary says it now so nobody waits to find out.
                    UNREADABLE="${UNREADABLE}${UNREADABLE:+, }${F} (${DETAIL})" ;;
                esac

                SZ=$(wc -c < /tmp/cg-file.yaml)
                if [ $((BYTES + SZ)) -gt 262144 ]; then
                  SKIPPED="${SKIPPED}${SKIPPED:+, }${F} (over the size ChangeGuard accepts)"
                  continue
                fi

                printf -- '---\n# %s\n' "${F}" >> /tmp/cg-manifest.yaml
                cat /tmp/cg-file.yaml >> /tmp/cg-manifest.yaml
                printf '\n' >> /tmp/cg-manifest.yaml
                BYTES=$((BYTES + SZ))
                COUNT=$((COUNT + 1))
                FILES="${FILES}${FILES:+, }${F}"
                if [ "${KIND}" = "object" ] && [ -n "${DETAIL}" ]; then
                  echo "${DETAIL}" | tr ';' '\n' | while IFS= read -r ID; do
                    [ -n "${ID}" ] && printf '%s\t%s\n' "${ID}" "${F}" >> /tmp/cg-ids.txt
                  done
                fi
              done < /tmp/cg-candidates.txt

              # Two changed files defining the SAME object. ChangeGuard judges
              # both and de-duplicates the findings, so the verdict is sound —
              # but which one wins at apply time depends on the customer's
              # tooling, not on anything ChangeGuard can see, so it says so
              # rather than picking one silently.
              if [ -s /tmp/cg-ids.txt ]; then
                DUPES=$(cut -f1 /tmp/cg-ids.txt | sort | uniq -d | paste -sd', ' -)
              fi

              if [ "${COUNT}" = "0" ] && [ -z "${NOTE}" ]; then
                NOTE="No Kubernetes manifest changed here, so ChangeGuard judged the environment rather than a proposed object. That is not the same as a manifest with nothing wrong with it."
              fi
            fi
          fi

          # The manifest stays in a file and never becomes a step output. A
          # multi-line value passed through an output is truncated or
          # reinterpreted, and a manifest that arrived subtly altered would be
          # judged as though the customer had written it that way.
          {
            echo "count=${COUNT}"
            echo "files=${FILES}"
            echo "skipped=${SKIPPED}"
            echo "unreadable=${UNREADABLE}"
            echo "duplicates=${DUPES}"
            echo "note<<CG_NOTE_EOF"
            echo "${NOTE}"
            echo "CG_NOTE_EOF"
          } >> "${GITHUB_OUTPUT}"

          if [ "${COUNT}" != "0" ]; then
            echo "Judging ${COUNT} proposed Kubernetes object(s): ${FILES}"
          else
            echo "${NOTE}"
          fi
          [ -z "${UNREADABLE}" ] || echo "Could not be read: ${UNREADABLE}"
          [ -z "${DUPES}" ]      || echo "Defined more than once: ${DUPES}"
          [ -z "${SKIPPED}" ]    || echo "Not submitted: ${SKIPPED}"

      - name: Pre-flight verdict
        id: preflight
        env:
          CG_KEY: ${{ secrets.CHANGEGUARD_API_KEY }}
          CG_URL_IN: ${{ inputs.backend_url }}
          CG_URL_VAR: ${{ vars.CHANGEGUARD_BACKEND_URL }}
          CG_ENV_IN: ${{ inputs.environment }}
          CG_ENV_VAR: ${{ vars.CHANGEGUARD_CLUSTER }}
          # Environment, never inline: a pull request title is written by
          # whoever opened the pull request.
          CG_PR_TITLE: ${{ github.event.pull_request.title }}
          CG_PR_NUMBER: ${{ github.event.pull_request.number }}
          CG_MANIFEST_COUNT: ${{ steps.proposed.outputs.count }}
          CG_MANIFEST_FILES: ${{ steps.proposed.outputs.files }}
          CG_MANIFEST_SKIPPED: ${{ steps.proposed.outputs.skipped }}
          CG_MANIFEST_UNREADABLE: ${{ steps.proposed.outputs.unreadable }}
          CG_MANIFEST_DUPES: ${{ steps.proposed.outputs.duplicates }}
          CG_MANIFEST_NOTE: ${{ steps.proposed.outputs.note }}
        run: |
          set -euo pipefail

          CG_URL="${CG_URL_IN:-${CG_URL_VAR:-https://api.changeguard.ai}}"
          CG_CLUSTER="${CG_ENV_IN:-${CG_ENV_VAR:-}}"
          APP_URL="${CG_URL/api./app.}"

          # ── Credential selection ────────────────────────────────────────
          # An explicit API key wins: a customer who set one is telling us
          # which identity to use, and silently authenticating as something
          # else would be a surprising way to be authorised.
          CG_AUTH_MODE=""
          CG_TOKEN=""
          if [ -n "${CG_KEY:-}" ]; then
            CG_AUTH_MODE="api_key"
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            # The audience matters. GitHub's default audience is the repository
            # owner's URL, which every other integration also receives; asking
            # for our own means the token we present was minted for us and
            # cannot be a replay of one issued to something else.
            IDT_HTTP=$(curl -sS -o /tmp/cg-idt.json -w '%{http_code}' --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H 'Accept: application/json; api-version=2.0' \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=changeguard") || IDT_HTTP="000"
            if [ "${IDT_HTTP}" = "200" ]; then
              CG_TOKEN=$(jq -r '.value // empty' /tmp/cg-idt.json)
            fi
            if [ -n "${CG_TOKEN}" ]; then
              CG_AUTH_MODE="oidc"
            fi
          fi

          if [ -z "${CG_AUTH_MODE}" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              # Much the most likely cause, and the only one the customer can
              # fix, so it gets named precisely rather than lumped in with
              # "authentication failed".
              echo "::error title=This workflow is not allowed to prove who it is::ChangeGuard signs in with a GitHub identity token, and GitHub only issues one when the workflow asks for permission. Add these two lines to the workflow that calls ChangeGuard, directly under the 'on:' block:%0A%0Apermissions:%0A  contents: read%0A  id-token: write%0A%0AChangeGuard's setup screen generates this for you if you would rather re-run it."
            else
              echo "::error title=GitHub would not issue an identity token::GitHub returned HTTP ${IDT_HTTP:-000} when this job asked for its identity token, so ChangeGuard has nothing to verify. This is a GitHub-side failure and is usually temporary — re-run the job. If it keeps happening, connect the repository again from ChangeGuard."
            fi
            exit 1
          fi

          # What the customer will read on the Change record months from now.
          # A pull request title is what they called this change; the repo and
          # commit are how ChangeGuard finds it again. The title is quoted from
          # the environment, never interpolated.
          CG_SUMMARY="${CG_PR_TITLE:-}"
          if [ -z "${CG_SUMMARY}" ]; then
            CG_SUMMARY="${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          fi

          # --rawfile, not --arg: the manifest is read from the file it was
          # written to, so nothing has to survive a shell variable intact.
          # jq emits it as a JSON string, escaping included.
          [ -s /tmp/cg-manifest.yaml ] || : > /tmp/cg-manifest.yaml
          BODY=$(jq -n \
            --arg cluster  "${CG_CLUSTER}" \
            --arg repo     "${GITHUB_REPOSITORY}" \
            --arg sha      "${GITHUB_SHA}" \
            --arg summary  "${CG_SUMMARY}" \
            --argjson prnum "${CG_PR_NUMBER:-0}" \
            --rawfile manifest /tmp/cg-manifest.yaml \
            '{cluster_id: $cluster, source: "ci", mode: "fast",
              change: ({summary: $summary, pr: {repo: $repo, sha: $sha}}
                       + (if $prnum > 0 then {pr: {repo: $repo, sha: $sha, number: $prnum}} else {} end)
                       + (if ($manifest | length) > 0 then {manifest: $manifest} else {} end))}')

          # HTTP status is separated from the body so a misconfiguration is
          # never mistaken for a clean verdict.
          if [ "${CG_AUTH_MODE}" = "api_key" ]; then
            HTTP=$(curl -sS -o /tmp/cg-preflight.json -w '%{http_code}' \
                     --max-time 30 -X POST "${CG_URL}/api/cicd/preflight" \
                     -H 'Content-Type: application/json' \
                     -H "X-API-Key: ${CG_KEY}" \
                     -d "${BODY}") || HTTP="000"
          else
            HTTP=$(curl -sS -o /tmp/cg-preflight.json -w '%{http_code}' \
                     --max-time 30 -X POST "${CG_URL}/api/cicd/preflight" \
                     -H 'Content-Type: application/json' \
                     -H "Authorization: Bearer ${CG_TOKEN}" \
                     -d "${BODY}") || HTTP="000"
          fi

          # ChangeGuard's refusals are written to be read by the person who has
          # to fix them, so they are surfaced rather than paraphrased.
          CG_MSG=$(jq -r '.error // .message // empty' /tmp/cg-preflight.json 2>/dev/null | head -c 400)

          case "${HTTP}" in
            200) ;;
            401)
              if [ "${CG_AUTH_MODE}" = "api_key" ]; then
                SECRET_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/settings/secrets/actions/new"
                echo "::error title=ChangeGuard rejected this repository::The CHANGEGUARD_API_KEY secret is wrong, revoked, or from a different account. Create a new key in ChangeGuard on the Preflight page, under GitHub Actions, then replace the secret here: ${SECRET_URL}%0A%0AOr remove the secret entirely and re-run ChangeGuard's setup to switch this repository to GitHub identity tokens, which need no secret at all."
              else
                echo "::error title=ChangeGuard did not accept this repository's identity token::${CG_MSG:-The token GitHub issued was not accepted.} This normally means the clock, the audience, or the token itself was wrong rather than anything you configured — re-run the job. If it persists, reconnect the repository from ChangeGuard."
              fi
              exit 1 ;;
            403)
              # Several different refusals arrive as 403: never connected, the
              # connection was revoked, the account is suspended, the
              # subscription expired. The backend knows which, and each of its
              # messages already carries the right instruction — "Reconnect it
              # in ChangeGuard under Integrations", or "Contact support".
              #
              # So this states no cause of its own. An earlier version titled
              # every 403 "not connected to this repository", which sat above a
              # body reading "Account suspended" and sent a billing problem to
              # the integrations page. A title that contradicts its own message
              # is worse than a vague one.
              echo "::error title=ChangeGuard refused to judge this change::${CG_MSG:-ChangeGuard is not connected to ${GITHUB_REPOSITORY}. Connect it, then re-run this job.}"
              exit 1 ;;
            409)
              echo "::error title=More than one ChangeGuard account has this repository::${CG_MSG:-ChangeGuard will not guess which account this job belongs to.} Open ${APP_URL}/integrations and disconnect ${GITHUB_REPOSITORY} from the account that should not have it."
              exit 1 ;;
            400|422)
              echo "::error title=ChangeGuard could not read this change::${CG_MSG}"
              exit 1 ;;
            *)
              # ChangeGuard is advisory: an outage must not take a pipeline down
              # with it. The change is simply unjudged, and says so.
              echo "::warning title=ChangeGuard could not be reached::No verdict for this change. Your pipeline continues."
              echo "verdict=UNAVAILABLE" >> "${GITHUB_OUTPUT}"
              {
                echo "## ⚪ ChangeGuard — UNAVAILABLE"
                echo ""
                echo "ChangeGuard could not be reached (HTTP ${HTTP}), so this change was **not judged**."
                echo "That is an absence of a verdict, not a clean one."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0 ;;
          esac

          VERDICT=$(jq -r '.verdict // "UNAVAILABLE"' /tmp/cg-preflight.json)
          CSC=$(jq -r '.csc // empty' /tmp/cg-preflight.json)
          CHANGE_ID=$(jq -r '.change_id // empty' /tmp/cg-preflight.json)
          VERDICT_ID=$(jq -r '.verdict_id // empty' /tmp/cg-preflight.json)
          EVIDENCE=$(jq -r '.environment_evidence // "unknown"' /tmp/cg-preflight.json)
          # environment_state is the precise answer; environment_evidence is the
          # older two-value one. Prefer the precise field when the backend sends
          # it, so a customer whose agent merely stopped reporting is never told
          # there is no environment.
          ENVSTATE=$(jq -r '.environment_state // empty' /tmp/cg-preflight.json)
          # On the OIDC path the environment comes from the connection, not from
          # this file, so report back what ChangeGuard actually judged against.
          ENVNAME=$(jq -r '.cluster_id // .environment // empty' /tmp/cg-preflight.json)
          [ -n "${ENVNAME}" ] && CG_CLUSTER="${ENVNAME}"

          if [ -z "${CHANGE_ID}" ]; then
            echo "::warning title=No change identity returned::The outcome for this change will not be linked to this judgment."
          fi

          {
            echo "verdict=${VERDICT}"
            echo "csc=${CSC}"
            echo "change_id=${CHANGE_ID}"
            echo "verdict_id=${VERDICT_ID}"
          } >> "${GITHUB_OUTPUT}"

          case "${VERDICT}" in
            SHIP)  ICON="🟢"; HEAD="Clear to ship" ;;
            HOLD)  ICON="🟡"; HEAD="Worth a look before shipping" ;;
            BLOCK) ICON="🔴"; HEAD="Not safe to ship" ;;
            *)     ICON="⚪"; HEAD="No verdict available" ;;
          esac

          case "${ENVSTATE:-}" in
            fresh)
              EVLINE="Judged against live evidence from **${CG_CLUSTER:-your environment}**." ;;
            stale)
              EVLINE="**${CG_CLUSTER}** is connected, but its last report is older than ChangeGuard will trust, so this change was judged on the change itself. Nothing needs reconnecting — the agent has stopped reporting." ;;
            unknown)
              EVLINE="No environment named **${CG_CLUSTER}** has ever reported to ChangeGuard, so this change was judged on the change itself. Check the name, or connect that environment." ;;
            unnamed)
              EVLINE="No environment was named for this repository, so this change was judged on the change itself." ;;
            *)
              # Backend predates environment_state. Fall back to the older field,
              # and keep its wording honest about what absent actually means.
              case "${EVIDENCE}" in
                present) EVLINE="Judged against live evidence from **${CG_CLUSTER:-your environment}**." ;;
                absent)  EVLINE="Judged on the change itself. ChangeGuard had no current environment evidence — that is an absence of evidence, not a clean result." ;;
                *)       EVLINE="" ;;
              esac ;;
          esac

          {
            echo "## ${ICON} ChangeGuard — ${VERDICT}"
            echo ""
            if [ "${EVIDENCE}" = "present" ]; then
              echo "**${HEAD}** · confidence ${CSC:-n/a}/100"
            else
              # No environment evidence means no environment score. Saying
              # "0/100" here would report an unmeasured environment as the
              # worst possible one.
              echo "**${HEAD}** · no environment score — this change was judged on itself"
            fi
            echo ""
            [ -n "${EVLINE}" ] && echo "${EVLINE}" && echo ""
            if [ "${CG_MANIFEST_COUNT:-0}" != "0" ]; then
              echo "Judged the change you proposed: \`${CG_MANIFEST_FILES}\`."
            elif [ -n "${CG_MANIFEST_NOTE:-}" ]; then
              echo "${CG_MANIFEST_NOTE}"
            fi
            echo ""
            if [ -n "${CG_MANIFEST_UNREADABLE:-}" ]; then
              echo "ChangeGuard could not read: ${CG_MANIFEST_UNREADABLE}"
              echo ""
              echo "It was still submitted, so the Change record says so — but a file ChangeGuard cannot parse is a part of this change it could not judge, which is not the same as a part it found nothing wrong with."
              echo ""
            fi
            if [ -n "${CG_MANIFEST_DUPES:-}" ]; then
              echo "Defined in more than one changed file: ${CG_MANIFEST_DUPES}. All of them were judged; which one applies depends on your tooling, not on anything ChangeGuard can see."
              echo ""
            fi
            if [ -n "${CG_MANIFEST_SKIPPED:-}" ]; then
              echo "Not judged: ${CG_MANIFEST_SKIPPED}"
              echo ""
            fi
            jq -r '.reasons // [] | .[] | "- " + .' /tmp/cg-preflight.json
            echo ""
            if [ -n "${CHANGE_ID}" ]; then
              echo "[View this Change in ChangeGuard](${APP_URL}/changes/${CHANGE_ID})"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply the verdict
        env:
          VERDICT: ${{ steps.preflight.outputs.verdict }}
          ENFORCE_BLOCK: ${{ inputs.enforce_block }}
          ENFORCE_HOLD: ${{ inputs.enforce_hold }}
        run: |
          set -euo pipefail
          case "${VERDICT}" in
            BLOCK)
              if [ "${ENFORCE_BLOCK}" = "true" ]; then
                echo "::error title=ChangeGuard: not safe to ship::See the job summary for what ChangeGuard found."
                exit 1
              fi
              echo "::warning title=ChangeGuard: not safe to ship (advisory)::enforce_block is false, so this pipeline continues." ;;
            HOLD)
              if [ "${ENFORCE_HOLD}" = "true" ]; then
                echo "::error title=ChangeGuard: worth a look::enforce_hold is true."
                exit 1
              fi
              echo "::warning title=ChangeGuard: worth a look before shipping::See the job summary." ;;
            SHIP)  echo "ChangeGuard: clear to ship." ;;
            *)     echo "ChangeGuard: no verdict available; continuing." ;;
          esac
